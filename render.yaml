databases:
  - name: deen-tracker-db
    plan: free
    databaseName: deen_tracker
    user: deen

services:
  - type: web
    name: deen-tracker
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deen-tracker-db
          property: connectionString
