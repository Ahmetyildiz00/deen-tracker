version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deen
      POSTGRES_PASSWORD: deen_secret_2024
      POSTGRES_DB: deen_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deen -d deen_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://deen:deen_secret_2024@db:5432/deen_tracker
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
